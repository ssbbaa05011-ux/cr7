<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">Lumen Store — متجر إلكتروني</title>
  <desc id="desc">واجهة متجر إلكتروني دافئة وأنيقة لمنتجات منزلية بتصميم تحريري.</desc>

  <defs>
    <linearGradient id="lumenBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4ece2"/>
      <stop offset="0.55" stop-color="#efe2d4"/>
      <stop offset="1" stop-color="#e8d7c7"/>
    </linearGradient>
    <radialGradient id="lumenGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#e7a47e" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#e7a47e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="lumenArch" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d9b8a1"/>
      <stop offset="0.5" stop-color="#c79272"/>
      <stop offset="1" stop-color="#a76348"/>
    </linearGradient>
    <linearGradient id="lumenVase" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f9f1e7"/>
      <stop offset="0.5" stop-color="#e9d5c1"/>
      <stop offset="1" stop-color="#c7a487"/>
    </linearGradient>
    <linearGradient id="lumenBtn" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2c211b"/>
      <stop offset="1" stop-color="#4a3429"/>
    </linearGradient>
    <filter id="lumenBlur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="55"/>
    </filter>
    <filter id="lumenShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#6b4938" flood-opacity="0.16"/>
    </filter>
  </defs>

  <!-- الخلفية -->
  <rect width="1200" height="900" fill="url(#lumenBg)"/>
  <circle cx="1060" cy="120" r="280" fill="url(#lumenGlow)" filter="url(#lumenBlur)"/>
  <circle cx="80" cy="820" r="250" fill="url(#lumenGlow)" filter="url(#lumenBlur)"/>
  <circle cx="1080" cy="790" r="150" fill="none" stroke="#9f6b50" stroke-opacity="0.12" stroke-width="1"/>
  <circle cx="1080" cy="790" r="210" fill="none" stroke="#9f6b50" stroke-opacity="0.08" stroke-width="1"/>

  <!-- نافذة المتصفح -->
  <g transform="translate(100 105)" filter="url(#lumenShadow)">
    <rect width="1000" height="690" rx="25" fill="#fffaf4" stroke="#e5d5c7"/>
    <path d="M0 25A25 25 0 0 1 25 0h950a25 25 0 0 1 25 25v20H0Z" fill="#f3e8dc"/>
    <circle cx="26" cy="23" r="4.5" fill="#d89b79"/>
    <circle cx="42" cy="23" r="4.5" fill="#e3bd91"/>
    <circle cx="58" cy="23" r="4.5" fill="#a9b99b"/>
    <rect x="405" y="15" width="190" height="17" rx="8.5" fill="#ffffff" fill-opacity="0.65"/>
    <text x="500" y="27" text-anchor="middle" fill="#8a6c5b" font-family="Arial, sans-serif" font-size="8" letter-spacing="1">lumen.store</text>

    <!-- شريط التنقل -->
    <text x="44" y="80" fill="#2a1f1a" font-family="Georgia, serif" font-size="21" font-weight="700" letter-spacing="4">LUMEN</text>
    <g fill="#5f4a3e" font-family="Arial, sans-serif" font-size="9">
      <text x="480" y="77">New in</text>
      <text x="548" y="77">Living</text>
      <text x="609" y="77">Table</text>
      <text x="664" y="77">Journal</text>
    </g>
    <circle cx="879" cy="73" r="14" fill="#f1e5d9"/>
    <circle cx="879" cy="73" r="4" fill="none" stroke="#6d5547" stroke-width="1.3"/>
    <path d="m882 77 4 4" stroke="#6d5547" stroke-width="1.3" stroke-linecap="round"/>
    <circle cx="920" cy="73" r="14" fill="#f1e5d9"/>
    <path d="M915 78v-8h10v8M914 70h12l-1-4h-10Z" fill="none" stroke="#6d5547" stroke-width="1.2" stroke-linejoin="round"/>
    <circle cx="945" cy="67" r="5" fill="#c56c47"/>
    <text x="945" y="70" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="6" font-weight="700">2</text>
    <path d="M44 99h912" stroke="#e8dbcf"/>

    <!-- الهيرو -->
    <text x="48" y="160" fill="#b06b4d" font-family="Arial, sans-serif" font-size="8" letter-spacing="2">THE AUTUMN EDIT</text>
    <text x="48" y="214" fill="#261c17" font-family="Georgia, serif" font-size="45" font-weight="400">Objects for</text>
    <text x="48" y="263" fill="#261c17" font-family="Georgia, serif" font-size="45" font-weight="400" font-style="italic">slow living.</text>
    <text x="48" y="292" fill="#725d51" font-family="Arial, sans-serif" font-size="9">Thoughtfully made pieces for the quiet moments at home.</text>
    <rect x="48" y="317" width="125" height="36" rx="18" fill="url(#lumenBtn)"/>
    <text x="110" y="339" text-anchor="middle" fill="#fffaf4" font-family="Arial, sans-serif" font-size="8" letter-spacing="0.5">Shop the edit</text>
    <text x="190" y="339" fill="#5f4a3e" font-family="Arial, sans-serif" font-size="8" text-decoration="underline">Explore journal</text>

    <!-- الصورة الرئيسية -->
    <path d="M530 115h270v300H530a135 135 0 0 1 0-270Z" fill="url(#lumenArch)"/>
    <path d="M530 115h270v300H530a135 135 0 0 1 0-270Z" fill="#2a1f1a" fill-opacity="0.05"/>
    <circle cx="803" cy="161" r="38" fill="#fff8ef" fill-opacity="0.18"/>
    <path d="M640 381c-2-55 10-95 48-112 38 17 50 57 48 112Z" fill="url(#lumenVase)"/>
    <path d="M658 269c-4-23 2-42 30-55 28 13 34 32 30 55Z" fill="#f6e9dc"/>
    <path d="M679 214c-1-18 4-31 9-41 5 10 10 23 9 41Z" fill="#7d8b6e"/>
    <path d="M688 210c10-12 22-18 34-20-4 12-14 23-29 28Z" fill="#8e9d7e"/>
    <path d="M688 216c-10-12-22-17-34-19 4 12 14 22 29 27Z" fill="#6f7e62"/>
    <path d="M610 410h120" stroke="#f8ede2" stroke-opacity="0.4"/>
    <text x="670" y="426" text-anchor="middle" fill="#fff8ef" fill-opacity="0.75" font-family="Arial, sans-serif" font-size="7" letter-spacing="1.5">HANDCRAFTED CERAMICS</text>

    <!-- شريط الشعارات -->
    <g opacity="0.45" fill="#70594b" font-family="Arial, sans-serif" font-size="7" letter-spacing="1">
      <text x="50" y="468">KINFOLK</text>
      <text x="145" y="468">CEREAL</text>
      <text x="235" y="468">MONOCLE</text>
      <text x="330" y="468">DWELL</text>
      <text x="418" y="468">AD</text>
    </g>
    <path d="M44 488h912" stroke="#e8dbcf"/>

    <!-- المنتجات -->
    <text x="44" y="519" fill="#261c17" font-family="Georgia, serif" font-size="16">Made to be kept</text>
    <text x="955" y="519" text-anchor="end" fill="#8a6c5b" font-family="Arial, sans-serif" font-size="8">View all →</text>

    <!-- منتج 1 -->
    <rect x="44" y="537" width="280" height="124" rx="10" fill="#f4e9dd"/>
    <circle cx="94" cy="596" r="32" fill="#d9b596"/>
    <path d="M75 617c2-24 9-35 19-35s17 11 19 35Z" fill="#b57454"/>
    <rect x="142" y="572" width="96" height="7" rx="3.5" fill="#3b2b22" fill-opacity="0.7"/>
    <rect x="142" y="586" width="67" height="5" rx="2.5" fill="#6f5546" fill-opacity="0.5"/>
    <text x="142" y="614" fill="#8a6c5b" font-family="Arial, sans-serif" font-size="8">$68.00</text>
    <circle cx="294" cy="596" r="13" fill="#2a1f1a"/>
    <path d="M290 596h8M294 592v8" stroke="#fffaf4" stroke-width="1.2" stroke-linecap="round"/>

    <!-- منتج 2 -->
    <rect x="344" y="537" width="280" height="124" rx="10" fill="#eee6d8"/>
    <circle cx="394" cy="596" r="32" fill="#c2b19a"/>
    <path d="M377 577h34l-5 39h-24Z" fill="#7f8b70"/>
    <path d="M382 577c0-12 7-19 12-19s12 7 12 19" fill="none" stroke="#657259" stroke-width="3"/>
    <rect x="442" y="572" width="100" height="7" rx="3.5" fill="#3b2b22" fill-opacity="0.7"/>
    <rect x="442" y="586" width="59" height="5" rx="2.5" fill="#6f5546" fill-opacity="0.5"/>
    <text x="442" y="614" fill="#8a6c5b" font-family="Arial, sans-serif" font-size="8">$42.00</text>
    <circle cx="594" cy="596" r="13" fill="#2a1f1a"/>
    <path d="M590 596h8M594 592v8" stroke="#fffaf4" stroke-width="1.2" stroke-linecap="round"/>

    <!-- منتج 3 -->
    <rect x="644" y="537" width="312" height="124" rx="10" fill="#f1e1d5"/>
    <circle cx="694" cy="596" r="32" fill="#d8a98b"/>
    <path d="M680 612c0-18 6-30 14-30s14 12 14 30Z" fill="#f7efe6"/>
    <path d="M686 582c0-10 3-15 8-15s8 5 8 15" fill="none" stroke="#e6d4c4" stroke-width="2"/>
    <rect x="742" y="572" width="88" height="7" rx="3.5" fill="#3b2b22" fill-opacity="0.7"/>
    <rect x="742" y="586" width="62" height="5" rx="2.5" fill="#6f5546" fill-opacity="0.5"/>
    <text x="742" y="614" fill="#8a6c5b" font-family="Arial, sans-serif" font-size="8">$96.00</text>
    <circle cx="924" cy="596" r="13" fill="#2a1f1a"/>
    <path d="M920 596h8M924 592v8" stroke="#fffaf4" stroke-width="1.2" stroke-linecap="round"/>
  </g>

  <!-- بطاقة عائمة -->
  <g transform="translate(920 720)">
    <rect width="185" height="67" rx="16" fill="#fffaf4" stroke="#e7d8ca"/>
    <circle cx="31" cy="33.5" r="14" fill="#f0e3d7"/>
    <path d="M25 35h12M28 31l3 8 3-8" fill="none" stroke="#8a5e45" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="54" y="29" fill="#2a1f1a" font-family="Arial, sans-serif" font-size="8" fill-opacity="0.5">FREE SHIPPING</text>
    <text x="54" y="45" fill="#2a1f1a" font-family="Georgia, serif" font-size="12">On orders over $120</text>
  </g>
</svg>
